<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} - {{ site_name }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ url }}">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.7;color:#1a1a2e;background:#f8f9fa;min-height:100vh}
.container{max-width:820px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#fff;padding:60px 0 40px;text-align:center}
header h1{font-size:2.2rem;font-weight:800;margin-bottom:8px}
header p{font-size:1.05rem;opacity:.8;max-width:600px;margin:0 auto}
nav{background:#fff;border-bottom:1px solid #e9ecef;padding:12px 0;position:sticky;top:0;z-index:10}
nav .container{display:flex;gap:24px;align-items:center}
nav a{color:#1a1a2e;text-decoration:none;font-size:.9rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
nav a:hover{color:#e94560}
.hero{background:#fff;border-radius:12px;padding:40px;margin:40px 0;box-shadow:0 2px 12px rgba(0,0,0,.06);text-align:center}
.hero h2{font-size:1.8rem;margin-bottom:12px}
.hero p{color:#6c757d;font-size:1.1rem;max-width:600px;margin:0 auto 20px}
.grid{display:grid;grid-template-columns:1fr;gap:24px;margin:32px 0}
.card{background:#fff;border-radius:10px;padding:28px;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.card h3{font-size:1.2rem;margin-bottom:8px}
.card h3 a{color:#1a1a2e;text-decoration:none}
.card h3 a:hover{color:#e94560}
.card .meta{font-size:.82rem;color:#adb5bd;margin-bottom:10px}
.card p{color:#495057;font-size:.95rem}
article{background:#fff;border-radius:12px;padding:40px;margin:32px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
article h1{font-size:1.8rem;margin-bottom:12px}
article .meta{font-size:.85rem;color:#adb5bd;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #e9ecef}
article h2{font-size:1.35rem;margin:28px 0 12px;color:#1a1a2e}
article h3{font-size:1.1rem;margin:20px 0 10px;color:#2d3436}
article p{margin-bottom:16px;color:#495057}
article ul,article ol{margin:0 0 16px 24px}
article li{margin-bottom:6px;color:#495057}
article a{color:#e94560;text-decoration:none;border-bottom:1px solid transparent}
article a:hover{border-bottom-color:#e94560}
article img{max-width:100%;border-radius:8px;margin:16px 0}
article blockquote{border-left:4px solid #e94560;padding:12px 20px;margin:16px 0;background:#f8f9fa;border-radius:0 8px 8px 0;color:#495057}
.affiliate-box{background:linear-gradient(135deg,#fff5f5 0%,#fff 100%);border:1px solid #ffe0e0;border-radius:10px;padding:20px;margin:24px 0}
.affiliate-box p{font-size:.9rem;color:#868e96;margin-top:8px}
.btn{display:inline-block;background:#e94560;color:#fff;padding:10px 24px;border-radius:6px;text-decoration:none;font-weight:600;font-size:.9rem;transition:background .2s}
.btn:hover{background:#c0392b}
footer{text-align:center;padding:32px 0;color:#adb5bd;font-size:.85rem;border-top:1px solid #e9ecef;margin-top:48px}
@media(max-width:600px){header{padding:40px 0 30px}header h1{font-size:1.6rem}article{padding:24px}.hero{padding:24px}}
</style>
</head>
<body>
<header>
<div class="container">
<h1>{{ site_name }}</h1>
<p>{{ site_tagline }}</p>
</div>
</header>
<nav>
<div class="container">
<a href="/">首页</a>
<a href="/categories/">分类</a>
<a href="/about/">关于</a>
</div>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer>
<div class="container">
<p>{{ site_name }} &copy; {{ year }} | 本站部分链接为联盟链接，您通过本站购物不会产生额外费用。</p>
</div>
</footer>
</body>
</html>
