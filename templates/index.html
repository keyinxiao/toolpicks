{% extends "base.html" %}
{% block content %}
<div class="hero">
  <h2>最新推荐</h2>
  <p>我们用过、测过、验证过的产品推荐，帮你做出更好的购买决策。</p>
</div>
<div class="grid">
  {% for article in articles %}
  <div class="card">
    <div class="meta">{{ article.date }}</div>
    <h3><a href="/{{ article.slug }}/">{{ article.title }}</a></h3>
    <p>{{ article.excerpt }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
